<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リダイレクト/切替テスト（別サイト擬似）</title>
<style>
  body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#111;line-height:1.7;}
  h1{font-size:20px;} h3{margin-top:26px;}
  .note{background:#fafafa;border:1px solid #e5e5e5;padding:12px 14px;font-size:13px;color:#555;}
  .row{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center;}
  input,select{padding:10px;border:1px solid #ccc;font-size:14px;}
  input{flex:1;min-width:220px;}
  button{padding:10px 16px;background:#0a0a0a;color:#fff;border:0;font-size:13px;cursor:pointer;}
  .samples a{display:inline-block;margin:4px 8px 4px 0;padding:6px 10px;border:1px solid #ccc;color:#0a0a0a;text-decoration:none;font-size:13px;}
  code{background:#f0f0f0;padding:1px 5px;}
</style>
</head>
<body>
  <h1>別サイト → MAP 遷移テスト（CARTO / Google 切替対応）</h1>
  <p class="note">
    ボタンで <code>index.html?event_id=◯◯</code> に遷移します。<br>
    地図プロバイダは <b>config.js の MAP_PROVIDER</b> が既定（CARTO）。テスト時は <code>&map=google</code> / <code>&map=carto</code> を付けると一時切替できます。
  </p>

  <div class="row">
    <input id="eid" type="text" placeholder="event_id（例: EV01003026）" value="EV01003026">
    <select id="provider">
      <option value="">config.js の既定</option>
      <option value="carto">CARTO 強制</option>
      <option value="google">Google 強制</option>
    </select>
    <button id="go">遷移</button>
    <button id="goBlank">別タブ</button>
  </div>

  <h3>サンプル（既定プロバイダ）</h3>
  <div class="samples">
    <a href="index.html?event_id=EV01003001">大阪市役所本庁舎</a>
    <a href="index.html?event_id=EV01003026">大阪市中央公会堂</a>
    <a href="index.html?event_id=EV01003073">綿業会館</a>
    <a href="index.html?event_id=EV01003162">日本橋の家</a>
    <a href="index.html?event_id=ZZZ999">存在しないID（トースト確認）</a>
  </div>

  <h3>プロバイダ切替の直接確認</h3>
  <div class="samples">
    <a href="index.html?map=carto&event_id=EV01003026">CARTO 版で開く</a>
    <a href="index.html?map=google&event_id=EV01003026">Google 版で開く</a>
  </div>

<script>
  const eid=document.getElementById('eid'), prov=document.getElementById('provider');
  function url(){
    let u='index.html?event_id='+encodeURIComponent(eid.value.trim());
    if(prov.value) u+='&map='+prov.value;
    return u;
  }
  document.getElementById('go').onclick=()=>location.href=url();
  document.getElementById('goBlank').onclick=()=>window.open(url(),'_blank');
  eid.addEventListener('keydown',e=>{if(e.key==='Enter')location.href=url();});
</script>
</body>
</html>
